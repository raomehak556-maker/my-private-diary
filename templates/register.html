<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - My Private Diary</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">
        <h1>📝 Create Account</h1>

        <p>Create an account for your private diary.</p>

        <form method="POST">

            <input
                type="email"
                name="email"
                placeholder="Email"
                required
            >

            <br><br>

            <input
                type="password"
                name="password"
                placeholder="Create Password"
                required
            >

            <br><br>

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm Password"
                required
            >

            <br><br>

            <button type="submit">Create Account</button>

        </form>

        <p>
            Already have an account?
            <a href="/login">Log in</a>
        </p>
    </div>

</body>
</html>
